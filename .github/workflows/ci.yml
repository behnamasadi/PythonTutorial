name: Run Tests

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push coverage badge + report to the python-coverage-comment-action-data branch
      pull-requests: write # coverage comment on PRs from this repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov numpy
          pip install -e python_tutorials/math_package
          # Install utility package with test dependencies
          pip install -e python_tutorials/utils[test]

      - name: Run tests with coverage
        run: pytest --cov=math_package --cov=utility --cov-report=term --cov-report=xml

      - name: Coverage badge and report
        # Default branch: stores badge.svg + HTML report in the
        # python-coverage-comment-action-data branch. PRs: posts a comment.
        if: github.event_name == 'pull_request' || github.ref_name == 'master'
        uses: py-cov-action/python-coverage-comment-action@e5fb2218463c3377f3504b0c5b5646ed53da7a2f # v4.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
