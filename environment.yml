# Direct dependencies of this repository, one line per package actually
# imported somewhere in the tutorials. Transitive dependencies are left to the
# solver. The fully resolved, pinned set lives in conda-lock.yml (generated).
#
#   conda env create -f environment.yml                  # latest compatible
#   conda-lock install -n PythonTutorial conda-lock.yml   # exact, reproducible
#
# After editing this file, regenerate the lock file (see README).
name: PythonTutorial
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.13

  # numerics and science
  - numpy
  - scipy
  - sympy
  - pandas
  - matplotlib
  - scikit-learn
  - scikit-image
  - pywavelets
  - networkx
  - hmmlearn

  # notebooks
  - jupyterlab
  - ipython

  # web APIs and protocols
  - fastapi
  - uvicorn
  - pydantic
  - httpx
  - requests
  - graphql-core
  - mcp
  - ollama-python # local LLMs (Qwen) through Ollama, used by the MCP notebook
  - anthropic # Claude API SDK, alternative LLM in the MCP notebook

  # GUI, images and misc
  - pyqt # PyQt5
  - pillow
  - pygame
  - pyyaml
  - tqdm

  # development and packaging
  - pytest
  - pytest-cov
  - python-build
  - pip
  - pip:
      # the repository's own example packages, installed in editable mode
      - -e ./python_tutorials/math_package
      - -e ./python_tutorials/utils
